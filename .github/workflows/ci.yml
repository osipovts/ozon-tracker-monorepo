name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/price-tracker

jobs:
  # A pull request only proves that the images build; they are pushed from master alone.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [hub, proxy-fetcher, handbook-fetcher, price-fetcher]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.app }}-prod
          build-args: APP_NAME=${{ matrix.app }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY_IMAGE }}-${{ matrix.app }}:${{ github.sha }}
            ${{ env.REGISTRY_IMAGE }}-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  # Runs on the runner of brutus, and only for a push to master: never for a pull request.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, brutus]
    env:
      DOCKER_HOST: unix:///run/user/1000/docker.sock
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Update the compose files
        run: cd ~/price-tracker && git pull --ff-only

      - name: Pull the images
        run: cd ~/price-tracker && docker compose -p price-tracker -f docker-compose.yml -f docker-compose.staging.yml -f docker-compose.registry.yml pull

      - name: Start the stack (the migrations run first)
        run: cd ~/price-tracker && docker compose -p price-tracker -f docker-compose.yml -f docker-compose.staging.yml -f docker-compose.registry.yml up -d --no-build

      - name: Remove the old images
        run: docker image prune -f
