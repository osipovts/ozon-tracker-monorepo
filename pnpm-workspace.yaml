packages:
  - apps/*
  - packages/*

# Lets `pnpm deploy` build the production dependencies of an app from the lockfile,
# without resolving them against the registry again (see the Dockerfiles).
injectWorkspacePackages: true

allowBuilds:
  esbuild: true
  # Optional native accelerator of msgpackr; BullMQ works without it.
  msgpackr-extract: false
  # Downloads the schema engine used by `prisma migrate`.
  '@prisma/engines': true
  prisma: true
  # Usage analytics of the Prisma packages.
  '@scarf/scarf': false
  # The binary comes as a platform package: no build script is needed.
  '@swc/core': false
