x-price-fetcher: &price-fetcher
  init: true
  env_file:
    - path: apps/price-fetcher/.env
      required: false
  build:
    context: .
    dockerfile: apps/price-fetcher/Dockerfile
    target: prod
    args:
      APP_NAME: price-fetcher

services:
  hub:
    container_name: price-tracker-hub
    image: hub:prod
    init: true
    build:
      context: .
      dockerfile: apps/hub/Dockerfile
      target: prod
    environment:
      DATABASE_URL: postgresql://hub:${POSTGRES_PASSWORD:-hub}@postgres:5432/hub
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-verbose}
    # The API has no authentication yet: it is reachable from this machine only.
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  proxy-fetcher:
    container_name: price-tracker-proxy-fetcher
    image: proxy-fetcher:prod
    init: true
    build:
      context: .
      dockerfile: apps/proxy-fetcher/Dockerfile
      target: prod
    environment:
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-verbose}
    depends_on:
      - redis
    restart: unless-stopped

  price-fetcher-worker:
    <<: *price-fetcher
    container_name: price-tracker-price-fetcher-worker
    image: price-fetcher:prod
    command: ['node', 'dist/worker.js']
    environment:
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-verbose}
    depends_on:
      - redis
    restart: unless-stopped

  price-fetcher-dev:
    <<: *price-fetcher
    container_name: price-tracker-price-fetcher-dev
    image: price-fetcher:dev
    profiles: ['dev']
    build:
      context: .
      dockerfile: apps/price-fetcher/Dockerfile
      target: dev
      args:
        APP_NAME: price-fetcher
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - price_fetcher_node_modules:/app/apps/price-fetcher/node_modules
      - pnpm_store:/pnpm-store
    environment:
      REDIS_URL: redis://redis:6379

  redis:
    image: redis:7-alpine
    container_name: price-tracker-redis
    # Persistence keeps queued jobs across restarts. The port is reachable from this
    # machine only, for the apps started with pnpm; never publish it on a public address.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: price-tracker-postgres
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub}
      POSTGRES_DB: hub
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hub -d hub']
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  node_modules:
  price_fetcher_node_modules:
  pnpm_store:
